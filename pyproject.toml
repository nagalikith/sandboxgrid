[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxgrid"
version = "0.1.0"
description = "Disposable browser sandboxes for AI agents: provisioning, live view, artifacts, and audit trails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nagalikith" }]
keywords = ["browser", "sandbox", "agents", "automation", "cdp", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "aio-pika>=9.4",
    "structlog>=24.1",
]

[project.optional-dependencies]
worker = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/nagalikith/sandboxgrid"

[tool.setuptools.packages.find]
include = ["sandbox_api*"]
